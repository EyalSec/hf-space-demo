# Test the page and build the Space image, then load the page from the image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q -p no:cacheprovider tests/
      - name: Build and load the Space image
        run: |
          docker build -t space .
          docker run -d --name space -p 127.0.0.1:7860:7860 space
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:7860/healthz && break; sleep 1; done
          curl -fs "http://127.0.0.1:7860/?case=cmd" | grep -q "subprocess shell"
